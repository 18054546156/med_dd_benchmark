# Kvasir - DC方法 - IPC10 - 完整配置
# Kvasir数据集尺寸较大(128x128)，需要更多计算资源

dataset: Kvasir
method: DC
model: ConvNet

# 数据集信息
num_classes: 8
channel: 3
im_size: [128, 128]

# 蒸馏参数
ipc: 10                    # Images Per Class
Iteration: 8000            # 大尺寸图像，迭代次数适中
lr_img: 100.0              # 大尺寸图像，学习率较大
batch_real: 64             # 大图像，批大小减小
batch_train: 64            # 训练批大小

# 外循环和内循环
outer_loop: 1              # 外循环次数
inner_loop: 50             # 内循环次数

# 评估参数
num_exp: 5                 # 实验次数
num_eval: 5                # 每次实验的评估次数
epoch_eval_train: 300      # 评估时训练轮数
eval_pool: "average"       # 评估池化方式
eval_it: 400               # 评估间隔

# 网络参数
net_train_real: True       # 在真实数据上训练网络
net_decay: False           # 网络权重衰减
net_act: "relu"            # 激活函数
depth: 5                   # 更深的网络（128x128需要更多层）
width: 128                 # ConvNet宽度

# 优化器参数
optimizer_img: "sgd"       # 图像优化器
momentum: 0.5              # 动量
lr_teacher: 0.01           # 教师网络学习率
weight_decay: 0.0005       # 权重衰减

# 数据增强（重要！）
dsa: True                  # 使用可微增强
dsa_strategy: "color_crop_cutout_flip_scale_rotate"
dsa_param: "default"

# 初始化
init: "real"               # 使用真实图像初始化

# 设备和路径
device: "cuda"
data_path: "data/prepared"
save_path: "../results/dc_dsa_dm/Kvasir/DC/ipc10"

# Wandb日志（可选）
wandb: False
project: "med_dd_kvasir_dc"

# 其他
dis_metric: "ours"         # 距离度量
seed: 0                    # 随机种子
save_images: True          # 保存合成图像

# Kvasir特定注意事项：
# 1. 图像尺寸大(128x128) - 需要更多GPU内存
# 2. 8个类别 - 类别较多
# 3. 类别不均衡 - 某些类别样本较少
# 4. 建议使用较大的学习率和较小的批大小
# 5. 如果GPU内存不足，可以减小batch_real到32
