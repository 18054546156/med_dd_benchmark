# DC - Kvasir - IPC10
# RAW 来源：raw/DatasetCondensation/main.py。
# MIGRATION：Kvasir 原图尺寸不固定，统一为 3x128x128、8 类；不是作者官方值。
# RESOURCE：batch=64、num_eval=5；DC 的 lr_img 和 Iteration 仍按 raw。

dataset: Kvasir
method: DC
model: ConvNet
num_classes: 8
channel: 3
im_size: [128, 128]
ipc: 10
Iteration: 1000       # RAW
lr_img: 0.1           # RAW：不因 128x128 擅自放大
lr_net: 0.01          # RAW
batch_real: 64        # RESOURCE：raw=256
batch_train: 64       # RESOURCE：raw=256
init: noise            # RAW
dsa_strategy: None
eval_mode: S
num_exp: 5
num_eval: 5            # RESOURCE：raw=20
epoch_eval_train: 300
data_path: data/prepared
save_path: results/dc_dsa_dm/Kvasir/DC/ipc10
device: auto
seed: 0
