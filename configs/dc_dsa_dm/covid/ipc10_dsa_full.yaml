# DSA - COVID - IPC10
# RAW 来源：raw/DatasetCondensation/main.py；method=DSA 开启可微 Siamese augmentation。
# CONTRACT：COVID 为 3x112x112、4 类；batch=128 是 RESOURCE。

dataset: COVID
method: DSA
model: ConvNetD5
num_classes: 4
channel: 3
im_size: [112, 112]
ipc: 10
Iteration: 1000       # RAW
lr_img: 0.1           # RAW
lr_net: 0.01          # RAW
batch_real: 128       # RESOURCE：raw=256
batch_train: 128      # RESOURCE：raw=256
init: noise            # RAW
dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW
eval_mode: S
num_exp: 5
num_eval: 5            # RESOURCE：raw=20
epoch_eval_train: 300
data_path: data/prepared
save_path: results/dc_dsa_dm/COVID/DSA/ipc10
device: auto
seed: 0
