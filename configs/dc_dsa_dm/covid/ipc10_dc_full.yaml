# COVID - DC方法 - IPC10 - 完整配置
# COVID数据集较小，需要更强的正则化和数据增强

dataset: COVID
method: DC
model: ConvNet

# 数据集信息
num_classes: 4
channel: 3
im_size: [112, 112]

# 蒸馏参数
ipc: 10                    # Images Per Class
Iteration: 5000            # COVID数据集较小，迭代次数可以适当减少
lr_img: 10.0               # 中等尺寸图像，学习率适当增大
batch_real: 128            # 数据集较小，批大小减小
batch_train: 128           # 训练批大小

# 外循环和内循环
outer_loop: 1              # 外循环次数
inner_loop: 50             # 内循环次数

# 评估参数
num_exp: 5                 # 实验次数
num_eval: 5                # 每次实验的评估次数
epoch_eval_train: 300      # 评估时训练轮数
eval_pool: "average"       # 评估池化方式
eval_it: 250               # 评估间隔（更频繁）

# 网络参数
net_train_real: True       # 在真实数据上训练网络
net_decay: False           # 网络权重衰减
net_act: "relu"            # 激活函数
depth: 4                   # 中等深度（112x112需要更多层）
width: 128                 # ConvNet宽度

# 优化器参数
optimizer_img: "sgd"       # 图像优化器
momentum: 0.5              # 动量
lr_teacher: 0.01           # 教师网络学习率
weight_decay: 0.001        # 较大的权重衰减（小数据集）

# 数据增强（重要！）
dsa: True                  # 使用可微增强
dsa_strategy: "color_crop_cutout_flip_scale_rotate"
dsa_param: "default"

# 初始化
init: "real"               # 使用真实图像初始化

# 设备和路径
device: "cuda"
data_path: "data/prepared"
save_path: "../results/dc_dsa_dm/COVID/DC/ipc10"

# Wandb日志（可选）
wandb: False
project: "med_dd_covid_dc"

# 其他
dis_metric: "ours"         # 距离度量
seed: 0                    # 随机种子
save_images: True          # 保存合成图像

# COVID特定注意事项：
# 1. 类别不均衡 - 可能需要类别加权
# 2. 数据量小 - 需要强数据增强
# 3. 图像尺寸中等 - 适中的学习率和批大小
