# DC - PathMNIST - IPC10
# RAW 来源：raw/DatasetCondensation/main.py。
# CONTRACT：PathMNIST 官方 28x28 -> 32x32，3 通道，9 类。
# method=DC 会关闭 DSA；不要把本文件当作 DSA 配置。

dataset: PathMNIST
method: DC
model: ConvNet
num_classes: 9
channel: 3
im_size: [32, 32]

ipc: 10
Iteration: 1000       # RAW：作者 main.py 默认值
lr_img: 0.1           # RAW：不要按图像尺寸擅自放大
lr_net: 0.01          # RAW
batch_real: 256       # RAW
batch_train: 256      # RAW
init: noise            # RAW：DC 作者默认从噪声初始化
dsa_strategy: None     # RAW：DC 不启用 DSA
eval_mode: S
num_exp: 5
num_eval: 5            # RESOURCE：raw=20，正式报告需记录此预算变化
epoch_eval_train: 300  # RAW
data_path: data/prepared
save_path: results/dc_dsa_dm/PathMNIST/DC/ipc10
device: auto
seed: 0
