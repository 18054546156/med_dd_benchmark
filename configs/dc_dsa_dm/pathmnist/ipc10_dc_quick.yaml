# PathMNIST - DC方法 - IPC10 - 快速测试配置
# 用于快速验证算法是否能正常运行

dataset: PathMNIST
method: DC
model: ConvNet

# 数据集信息
num_classes: 9
channel: 3
im_size: [32, 32]

# 蒸馏参数
ipc: 10                    # Images Per Class
Iteration: 500             # 快速测试：500次迭代
lr_img: 1.0                # 合成图像学习率
batch_real: 256            # 真实数据批大小
batch_train: 256           # 训练批大小

# 评估参数
num_exp: 1                 # 实验次数
num_eval: 3                # 每次实验的评估次数
epoch_eval_train: 50       # 评估时训练轮数
eval_pool: "average"       # 评估池化方式
eval_it: 100               # 评估间隔

# 网络参数
net_train_real: True       # 在真实数据上训练网络
net_decay: False           # 网络权重衰减
net_act: "relu"            # 激活函数

# 优化器参数
optimizer_img: "sgd"       # 图像优化器
momentum: 0.5              # 动量
lr_teacher: 0.01           # 教师网络学习率

# 数据增强
dsa: True                  # 使用可微增强
dsa_strategy: "color_crop_cutout_flip_scale_rotate"

# 初始化
init: "real"               # 使用真实图像初始化

# 设备和路径
device: "cuda"
data_path: "data/prepared"
save_path: "../results/dc_dsa_dm/PathMNIST/DC/ipc10"

# 其他
dis_metric: "ours"         # 距离度量
seed: 0                    # 随机种子
