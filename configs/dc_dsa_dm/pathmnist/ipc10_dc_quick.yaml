# DC - PathMNIST - IPC10 smoke
# SMOKE：Iteration=500、num_exp=1 只验证入口，不用于论文结果。
# RAW 参考：lr_img=0.1、init=noise、DC 不启用 DSA。

dataset: PathMNIST
method: DC
model: ConvNet
num_classes: 9
channel: 3
im_size: [32, 32]
ipc: 10
Iteration: 500          # SMOKE：缩短计算预算
lr_img: 0.1             # RAW
lr_net: 0.01            # RAW
batch_real: 256
batch_train: 256
init: noise
dsa_strategy: None
eval_mode: S
num_exp: 1
num_eval: 1
epoch_eval_train: 1
data_path: data/prepared
save_path: results/official_smoke/dc/PathMNIST/ipc10
device: auto
seed: 0
