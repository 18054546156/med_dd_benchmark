# MTT - PathMNIST - IPC10
# 参数来源：raw/mtt-distillation/distill.py 与 raw/mtt-distillation/buffer.py。
# CONTRACT：PathMNIST 为 3x32x32、9 类；这是统一数据合同，不是 MTT 作者医疗配置。
# MTT 必须按 buffer -> distill 两阶段运行；不能复用 CIFAR 的专家轨迹。

dataset: PathMNIST
model: ConvNet
num_classes: 9
channel: 3
im_size: [32, 32]

# 第一阶段：生成当前数据集专属专家轨迹。
buffer:
  model: ConvNet
  train_epochs: 50        # RAW：buffer.py 默认值
  num_experts: 100        # RAW：buffer.py 默认值
  buffer_path: buffers/mtt # 记录值；统一入口会传入仓库绝对路径
  batch_train: 256        # RAW：buffer.py 默认值
  batch_real: 256         # RAW：buffer.py 默认值
  lr_teacher: 0.01        # RAW：buffer.py 默认值
  save_interval: 10       # RAW：每 10 条轨迹保存一个文件

# 第二阶段：使用上一步生成的轨迹蒸馏合成图像。
distillation:
  ipc: 10
  Iteration: 5000         # RAW：distill.py 默认值
  lr_img: 1000            # RAW：MTT 作者默认值，不能按 DC 学习率缩放
  lr_lr: 1e-5             # RAW
  lr_teacher: 0.01        # RAW
  batch_real: 256         # RAW
  batch_train: 256        # RAW
  batch_syn: null         # RAW：null 表示使用完整合成 batch
  expert_epochs: 3        # RAW
  syn_steps: 20            # RAW
  max_start_epoch: 25     # RAW
  pix_init: real          # RAW：从真实图像初始化合成图像
  dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW

augmentation:
  dsa: true               # RAW：MTT 的专家训练和蒸馏都使用 DSA

# 下面是评估入口使用的参数；num_eval=5 是本 benchmark 的 RESOURCE 预算，
# raw 默认更大时，应在实验记录中说明评估预算变化。
evaluation:
  num_eval: 5
  eval_it: 100
  epoch_eval_train: 1000
  eval_mode: S

init: real
device: cuda
data_path: data/prepared
buffer_path: buffers/mtt
save_path: results/mtt/PathMNIST/ipc10
zca: false
seed: 0

# network/optimizer 的结构记录不会自动覆盖 raw argparse；真正生效的参数由
# scripts/run_config.py 显式映射，避免把不同算法强行统一。
network:
  depth: 3             # MIGRATION：PathMNIST 32x32 参考 CIFAR ConvNet
  width: 128
optimizer:
  momentum: 0.5
  weight_decay: 0.0005
