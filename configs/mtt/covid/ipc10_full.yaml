# COVID - MTT轨迹匹配 - IPC10 - 完整配置
# 需要先运行buffer.py生成专家轨迹

dataset: COVID
model: ConvNet

# 数据集信息
num_classes: 4
channel: 3
im_size: [112, 112]

# Buffer生成配置（第一步）
buffer:
  model: ConvNet
  train_epochs: 150        # 训练epoch数（小数据集减少epoch）
  num_experts: 50          # 专家数量（小数据集减少专家数）
  buffer_path: ./buffers   # buffer保存路径
  batch_train: 128         # 训练批大小
  lr_teacher: 0.01         # 教师学习率
  save_interval: 10        # 保存间隔

# 蒸馏配置（第二步）
distillation:
  ipc: 10                  # Images Per Class
  Iteration: 5000          # 蒸馏迭代次数（小数据集减少）

  # 轨迹匹配参数
  syn_steps: 40            # 合成步数
  expert_epochs: 3         # 每次采样的专家epoch数

  # 学习率
  lr_img: 10.0             # 合成图像学习率（中等尺寸）
  lr_lr: 1e-5              # 学习率的学习率

  # 批大小
  batch_real: 128          # 真实数据批大小
  batch_train: 128         # 训练批大小
  batch_syn: None          # 合成批大小

  # 采样策略
  max_start_epoch: 30      # 最大起始epoch

# 网络配置
network:
  depth: 4                 # ConvNet深度（中等尺寸）
  width: 128               # ConvNet宽度
  norm_type: instance      # 归一化类型
  activation: relu         # 激活函数

# 优化器配置
optimizer:
  optimizer_img: sgd       # 图像优化器
  momentum: 0.5            # 动量
  weight_decay: 0.001      # 权重衰减（小数据集增大）

# 数据增强（重要！）
augmentation:
  dsa: True                # 使用可微增强
  dsa_strategy: "color_crop_cutout_flip_scale_rotate"

# 评估配置
evaluation:
  num_eval: 5              # 评估次数
  epoch_eval_train: 300    # 评估时训练轮数
  eval_it: 250             # 评估间隔
  eval_mode: "S"           # 评估模式

# 初始化
init: "real"               # 使用真实图像初始化

# 设备和路径
device: cuda
data_path: data/prepared
buffer_path: ./buffers/COVID
save_path: ../results/mtt/COVID/ipc10

# Wandb（可选）
wandb: False
project: med_dd_covid_mtt

# 其他
seed: 0
save_images: True

# COVID特定注意：
# 1. 数据集较小，减少num_experts和train_epochs
# 2. 类别不均衡，可能需要类别加权
# 3. 需要强数据增强
