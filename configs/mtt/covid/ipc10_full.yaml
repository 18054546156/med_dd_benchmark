# MTT - COVID - IPC10
# 参数来源：raw/mtt-distillation/distill.py 与 raw/mtt-distillation/buffer.py。
# CONTRACT：COVID 为 3x112x112、4 类；112 来自 HoP-TM 的作者配置。
# batch=128 是 RESOURCE（大于 raw 的 256 会降低显存占用），核心轨迹匹配参数按 RAW。

dataset: COVID
model: ConvNetD5       # 医疗迁移配置：112x112 使用 D5；必须重新生成对应 buffer
num_classes: 4
channel: 3
im_size: [112, 112]

buffer:
  model: ConvNetD5      # 必须与顶层 model 完全一致
  train_epochs: 50        # RAW：buffer.py 默认值
  num_experts: 100        # RAW：buffer.py 默认值；不能因数据量小擅自减少
  buffer_path: buffers/mtt
  batch_train: 128        # RESOURCE：112x112 显存适配，raw=256
  batch_real: 128         # RESOURCE：与 train batch 保持一致
  lr_teacher: 0.01        # RAW
  save_interval: 10       # RAW

distillation:
  ipc: 10
  Iteration: 5000         # RAW
  lr_img: 1000            # RAW：MTT 作者默认值
  lr_lr: 1e-5             # RAW
  lr_teacher: 0.01        # RAW
  batch_real: 128         # RESOURCE：raw=256
  batch_train: 128        # RESOURCE：raw=256
  batch_syn: null
  expert_epochs: 3        # RAW
  syn_steps: 20            # RAW
  max_start_epoch: 25     # RAW
  pix_init: real          # RAW
  dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW

augmentation:
  dsa: true

evaluation:
  num_eval: 5             # RESOURCE：降低评估模型数量，不能当作作者结果
  eval_it: 100
  epoch_eval_train: 1000
  eval_mode: S

init: real
device: cuda
data_path: data/prepared
buffer_path: buffers/mtt
save_path: results/mtt/COVID/ipc10
zca: false
seed: 0

network:
  depth: 5                # MIGRATION：D5 结构记录；入口以 model 为准
  width: 128
optimizer:
  momentum: 0.5
  weight_decay: 0.0005
