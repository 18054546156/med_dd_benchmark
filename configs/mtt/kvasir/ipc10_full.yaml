# MTT - Kvasir - IPC10
# 参数来源：raw/mtt-distillation/distill.py 与 raw/mtt-distillation/buffer.py。
# MIGRATION：Kvasir 原图尺寸不固定，本 benchmark 统一为 3x128x128、8 类。
# batch=64 是 RESOURCE；lr_img、Iteration、syn_steps 等核心参数保持 RAW。

dataset: Kvasir
model: ConvNetD5       # 医疗迁移配置：128x128 使用 D5；必须重新生成对应 buffer
num_classes: 8
channel: 3
im_size: [128, 128]

buffer:
  model: ConvNetD5      # 必须与顶层 model 完全一致
  train_epochs: 50        # RAW
  num_experts: 100        # RAW
  buffer_path: buffers/mtt
  batch_train: 64         # RESOURCE：128x128 显存适配，raw=256
  batch_real: 64          # RESOURCE
  lr_teacher: 0.01        # RAW
  save_interval: 10       # RAW

distillation:
  ipc: 10
  Iteration: 5000         # RAW
  lr_img: 1000            # RAW：MTT 作者默认值
  lr_lr: 1e-5             # RAW
  lr_teacher: 0.01        # RAW
  batch_real: 64          # RESOURCE：raw=256
  batch_train: 64         # RESOURCE：raw=256
  batch_syn: null
  expert_epochs: 3        # RAW
  syn_steps: 20            # RAW
  max_start_epoch: 25     # RAW
  pix_init: real          # RAW
  dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW

augmentation:
  dsa: true

evaluation:
  num_eval: 5             # RESOURCE
  eval_it: 100
  epoch_eval_train: 1000
  eval_mode: S

init: real
device: cuda
data_path: data/prepared
buffer_path: buffers/mtt
save_path: results/mtt/Kvasir/ipc10
zca: false
seed: 0

network:
  depth: 5                # MIGRATION：128x128 的结构记录；入口以 model 为准
  width: 128
optimizer:
  momentum: 0.5
  weight_decay: 0.0005
