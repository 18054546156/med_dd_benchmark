# HoP-TM PathMNIST configuration.
# Buffer generation uses adapted/hop_tm/buffer/buffer_FTD.py.
dataset: PathMNIST
device: [0]
model: ConvNet
ipc: 10
syn_steps: 80
expert_epochs: 2
lr_img: 1
lr_teacher: 0.01
buffer_path: ../../buffers
data_path: data/prepared
ema_decay: 0.995
Iteration: 10000
batch_syn: 10
batch_train: 128
project: pathmnist_high_order
wandb: false
num_eval: 5
eval_it: 500
skip_first_eva: true
pix_init: real
high_order: true
base_threshold: 5e-9
growing_factor: 1.5
lamb: 0.5
min_start_epoch: 0
max_start_epoch: 4
lr_lr: 1e-7
zca: false
dsa: true
dsa_strategy: color_crop_cutout_flip_scale_rotate
depth: 3
width: 128
norm_type: instance
optimizer: sgd
momentum: 0.5
weight_decay: 0.0005
save_path: results/hop_tm/PathMNIST/ipc10
save_images: true
save_interval: 1000
