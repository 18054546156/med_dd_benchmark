# HoP-TM - Kvasir - IPC10
# Kvasir 没有 HoP-TM 作者官方 YAML；本文件是 MIGRATION，不是原论文配置。
# 参考：作者 COVID 的 ConvNetD5/高阶轨迹设置，并将输入合同迁移到 3x128x128、8 类。
# 必须先生成 Kvasir 专属 buffer；不允许复制 PathMNIST 或 COVID 的 buffer。

dataset: Kvasir
num_classes: 8
channel: 3
im_size: [128, 128]
device: [0]
model: ConvNetD5       # MIGRATION：参考 COVID 的高阶轨迹网络
ipc: 10
syn_steps: 80          # MIGRATION：沿用作者 COVID/PathMNIST
expert_epochs: 2       # MIGRATION：沿用作者医疗配置
lr_img: 100             # MIGRATION：参考 COVID；需在验证集确认
lr_teacher: 0.001       # MIGRATION：参考 COVID；需在验证集确认
buffer_path: buffers/hop_tm
data_path: data/prepared
ema_decay: 0.995
Iteration: 10000       # MIGRATION：沿用作者医疗配置
batch_syn: 10
batch_train: 64        # RESOURCE：128x128 显存适配，作者医疗配置为 128
batch_real: 64         # RESOURCE：buffer 的 real loader 同步降 batch
num_experts: 100       # MIGRATION：沿用 buffer_FTD.py 默认值
train_epochs: 100      # MIGRATION：沿用 buffer_FTD.py 默认值
project: kvasir_high_order
num_eval: 1
eval_it: 500
skip_first_eva: true
pix_init: real
high_order: true
base_threshold: 1e-10  # MIGRATION：参考 COVID；需验证
growing_factor: 1.3    # MIGRATION：参考 COVID；需验证
lamb: 1.0              # MIGRATION：参考 COVID；需验证
min_start_epoch: 0
max_start_epoch: 20    # MIGRATION：参考 COVID；需验证
lr_lr: 1e-7
zca: false
dsa: true
dsa_strategy: color_crop_cutout_flip_scale_rotate
save_path: results/hop_tm/Kvasir/ipc10
save_images: true
save_interval: 10
