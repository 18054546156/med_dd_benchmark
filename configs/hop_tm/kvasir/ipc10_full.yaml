# Kvasir - HoP-TM高阶轨迹匹配 - IPC10 - 完整配置
# 专为医疗图像设计的数据集蒸馏算法

dataset: Kvasir
device: [0]

# 模型配置
model: ConvNet
ipc: 10
syn_steps: 80              # 合成步数
expert_epochs: 2           # 专家轨迹epoch数
lr_img: 100                # 大尺寸图像学习率
lr_teacher: 0.01           # 教师网络学习率

# Buffer路径
buffer_path: ../buffer/buffers/

# 数据路径
data_path: data/prepared
ema_decay: 0.995           # EMA衰减率
Iteration: 10000           # 蒸馏迭代次数
batch_syn: 10              # 合成批大小
batch_train: 64            # 训练批大小（大图像，批大小较小）

# Wandb配置
project: kvasir_high_order
wandb: False

# 评估配置
num_eval: 5                # 评估次数
eval_it: 500               # 评估间隔
skip_first_eva: True       # 跳过第一次评估

# 初始化
pix_init: real             # 使用真实图像初始化

# 高阶匹配配置（HoP-TM核心）
high_order: True           # 启用高阶匹配
base_threshold: 5e-9       # 基础阈值
growing_factor: 1.5        # 增长因子
lamb: 0.5                  # Lambda参数（高阶项权重）

# 专家轨迹配置
min_start_epoch: 0         # 最小起始epoch
max_start_epoch: 4         # 最大起始epoch
lr_lr: 0.0000001           # 学习率的学习率

# ZCA白化
zca: False                 # 不使用ZCA（Kvasir不需要）

# 数据增强
dsa: True
dsa_strategy: "color_crop_cutout_flip_scale_rotate"

# 网络配置
depth: 5                   # 网络深度（128x128需要更深）
width: 128                 # 网络宽度
norm_type: instance        # Instance Normalization

# 优化器配置
optimizer: sgd
momentum: 0.5
weight_decay: 0.0005

# 保存配置
save_path: ../results/hop_tm/Kvasir/ipc10
save_images: True
save_interval: 1000

# Kvasir特定说明：
# 1. 128x128大尺寸，需要depth=5
# 2. 8个类别，类别不均衡
# 3. 高阶匹配对医疗图像特别有效
# 4. 建议使用较大的lr_img (100)
# 5. batch_train=64适合大图像
