# CAFE - COVID - IPC10
# RAW 来源：raw/CAFE/distill.py；核心权重和双层优化保持作者默认。
# CONTRACT：COVID 为 3x112x112、4 类；batch=128 是 RESOURCE，raw=256。

dataset: COVID
method: CAFE
model: ConvNetD5
num_classes: 4
channel: 3
im_size: [112, 112]

ipc: 10
Iteration: 2000       # RAW
lr_img: 0.1           # RAW；不因 112x112 擅自放大
lr_net: 0.01          # RAW
batch_real: 128       # RESOURCE：raw=256
batch_train: 128      # RESOURCE：raw=256
init: noise            # RAW
dsa_strategy: None     # RAW

first_weight: 1.0     # RAW
second_weight: 1.0    # RAW
third_weight: 0.1     # RAW
fourth_weight: 0.1    # RAW
inner_weight: 0.01    # RAW
lambda_1: 0.04        # RAW
lambda_2: 0.03        # RAW

evaluation:
  eval_mode: S
  num_exp: 1           # RESOURCE
  num_eval: 5          # RESOURCE
  epoch_eval_train: 300

cafe:
  feature_layers: [2, 3]
  note: "说明性记录；当前 raw CLI 不直接消费 feature_layers"

device: cuda
data_path: data/prepared
save_path: results/cafe/COVID/ipc10
seed: 0
