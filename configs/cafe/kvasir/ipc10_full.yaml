# CAFE - Kvasir - IPC10
# RAW 来源：raw/CAFE/distill.py；核心权重、学习率和更新流程按 RAW。
# MIGRATION：Kvasir 原图尺寸不固定，统一为 3x128x128、8 类；不是作者官方设置。
# batch=64 是 RESOURCE，原因是特征对齐在 128x128 上显存开销更高。

dataset: Kvasir
method: CAFE
model: ConvNet
num_classes: 8
channel: 3
im_size: [128, 128]

ipc: 10
Iteration: 2000       # RAW
lr_img: 0.1           # RAW；不因 128x128 擅自放大
lr_net: 0.01          # RAW
batch_real: 64        # RESOURCE：raw=256
batch_train: 64       # RESOURCE：raw=256
init: noise            # RAW
dsa_strategy: None     # RAW

first_weight: 1.0     # RAW
second_weight: 1.0    # RAW
third_weight: 0.1     # RAW
fourth_weight: 0.1    # RAW
inner_weight: 0.01    # RAW
lambda_1: 0.04        # RAW
lambda_2: 0.03        # RAW

evaluation:
  eval_mode: S
  num_exp: 1           # RESOURCE
  num_eval: 5          # RESOURCE
  epoch_eval_train: 300

cafe:
  feature_layers: [2, 3, 4]
  note: "说明性记录；当前 raw CLI 不直接消费 feature_layers"

device: cuda
data_path: data/prepared
save_path: results/cafe/Kvasir/ipc10
seed: 0
