# CAFE - PathMNIST - IPC10
# RAW 来源：raw/CAFE/distill.py；保留多层 feature alignment 和 bi-level loop。
# CONTRACT：PathMNIST 为 3x32x32、9 类；只有数据入口和类别数迁移。

dataset: PathMNIST
method: CAFE
model: ConvNet
num_classes: 9
channel: 3
im_size: [32, 32]

ipc: 10
Iteration: 2000       # RAW：CAFE distill.py 默认值
lr_img: 0.1           # RAW
lr_net: 0.01          # RAW
batch_real: 256       # RAW
batch_train: 256      # RAW
init: noise            # RAW
dsa_strategy: None     # RAW：CAFE 默认关闭 DSA

# CAFE 原始 CLI 中的损失权重；这些字段会被 run_config.py 显式传递。
first_weight: 1.0
second_weight: 1.0
third_weight: 0.1
fourth_weight: 0.1
inner_weight: 0.01
lambda_1: 0.04
lambda_2: 0.03

evaluation:
  eval_mode: S
  num_exp: 1            # RESOURCE：正式报告应增加独立 seed
  num_eval: 5           # RESOURCE
  epoch_eval_train: 300 # RAW/评估预算记录

# 说明性记录：当前 raw CLI 没有这些参数，不能声称会改变运行流程。
cafe:
  feature_layers: [2, 3]
  note: "CAFE 的实际层级由 raw 网络和 loss 实现决定"

device: cuda
data_path: data/prepared
save_path: results/cafe/PathMNIST/ipc10
seed: 0
