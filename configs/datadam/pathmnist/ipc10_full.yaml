# DataDAM - PathMNIST - IPC10
# RAW 来源：raw/DataDAM/main_DataDAM.py；只替换医疗数据合同。
# CONTRACT：3x32x32、9 类。DataDAM 原始入口的核心参数保持不变。

dataset: PathMNIST
method: DataDAM
model: ConvNet
num_classes: 9
channel: 3
im_size: [32, 32]

ipc: 10
Iteration: 20000       # RAW：main_DataDAM.py 默认值
lr_img: 1              # RAW：作者默认值
lr_net: 0.01           # RAW
batch_real: 64         # RAW
batch_train: 64        # RAW
init: real              # RAW
dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW
task_balance: 0.01     # RAW
zca: false             # RAW：默认关闭

evaluation:
  eval_mode: SS
  num_exp: 1            # RESOURCE：正式多 seed 请另行增加
  num_eval: 10         # RAW：main_DataDAM.py 默认值
  epoch_eval_train: 1800 # RAW：main_DataDAM.py 默认值

# 这些字段用于记录 DataDAM 的概念，不会被 raw CLI 自动解析；
# 当前真正生效的字段由 scripts/run_config.py 显式映射。
attention:
  attn_type: spatial
  match_type: mse
  note: "说明性记录，不改变当前 raw 入口"
extract_attention:
  note: "DataDAM raw 入口没有独立的 gradcam CLI 参数"

device: cuda
data_path: data/prepared
save_path: results/datadam/PathMNIST/ipc10
seed: 0
