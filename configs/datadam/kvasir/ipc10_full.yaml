# DataDAM - Kvasir - IPC10
# RAW 来源：raw/DataDAM/main_DataDAM.py。
# MIGRATION：Kvasir 原图尺寸不固定，统一 resize 到 3x128x128、8 类。
# 其余核心参数保持 RAW；128x128 不是 DataDAM 作者的 Kvasir 官方设置。

dataset: Kvasir
method: DataDAM
model: ConvNet
num_classes: 8
channel: 3
im_size: [128, 128]

ipc: 10
Iteration: 20000       # RAW
lr_img: 1              # RAW；不因 128x128 擅自改成 100
lr_net: 0.01           # RAW
batch_real: 64         # RAW
batch_train: 64        # RAW
init: real              # RAW
dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW
task_balance: 0.01     # RAW
zca: false

evaluation:
  eval_mode: SS
  num_exp: 1            # RESOURCE
  num_eval: 10          # RAW
  epoch_eval_train: 1800 # RAW

# 说明性字段：不被当前 raw CLI 直接消费。
attention:
  attn_type: spatial
  match_type: mse
  note: "Kvasir 注意力分析记录，不等于新增损失项"
extract_attention:
  note: "raw DataDAM 入口没有独立 gradcam 参数"

device: cuda
data_path: data/prepared
save_path: results/datadam/Kvasir/ipc10
seed: 0
