# DataDAM - COVID - IPC10
# RAW 来源：raw/DataDAM/main_DataDAM.py。
# CONTRACT：COVID 为 3x112x112、4 类；batch=64 保持 raw，不是 COVID 官方最优值。

dataset: COVID
method: DataDAM
model: ConvNet
num_classes: 4
channel: 3
im_size: [112, 112]

ipc: 10
Iteration: 20000       # RAW
lr_img: 1              # RAW；不因 112x112 擅自改成 10
lr_net: 0.01           # RAW
batch_real: 64         # RAW
batch_train: 64        # RAW
init: real              # RAW
dsa_strategy: color_crop_cutout_flip_scale_rotate # RAW
task_balance: 0.01     # RAW
zca: false

evaluation:
  eval_mode: SS
  num_exp: 1            # RESOURCE：正式实验需要记录 seed 数量
  num_eval: 10          # RAW
  epoch_eval_train: 1800 # RAW

# 说明性字段：当前 run_config.py 不会把它们转成额外 CLI 参数。
attention:
  attn_type: spatial
  match_type: mse
  note: "医疗注意力解释记录，不改变 raw DataDAM 流程"
extract_attention:
  note: "raw 入口没有独立注意力提取器参数"

device: cuda
data_path: data/prepared
save_path: results/datadam/COVID/ipc10
seed: 0
